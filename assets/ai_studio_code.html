<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntentCraft — L'Atelier d'Intention</title>
  
  <!-- Fonts: Instrument/Playfair Serif + Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cormorant Garamond', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            obsidian: '#07080B',
            atelier: '#0D1017',
            cardbg: '#111520',
            gold: {
              300: '#F3E5AB',
              400: '#E6CA85',
              500: '#D4AF37',
              600: '#AA820A'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel for standalone execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Luxury Hairlines & Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #07080B; }
    ::-webkit-scrollbar-thumb { background: #1E2433; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
    .gold-glow {
      box-shadow: 0 0 35px -5px rgba(212, 175, 55, 0.15);
    }
    .text-glow {
      text-shadow: 0 0 20px rgba(243, 229, 171, 0.3);
    }
    .highlight-span {
      background: rgba(212, 175, 55, 0.2);
      border-bottom: 1.5px solid #E6CA85;
      padding: 0 2px;
      border-radius: 2px;
    }
  </style>
</head>
<body class="bg-obsidian text-slate-300 font-sans antialiased selection:bg-gold-500/20 selection:text-gold-300 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- ACCEPTANCE JOURNEY FIXTURES (Bölüm 12) ---
    const INITIAL_SOURCE = "Fikirlerimi konuşarak anlatmak istiyorum. Sistem ben konuşurken doğru kavramları göstersin. Belki fikirlerimi otomatik taşıyabilir ama yanlış anlarsa kontrol bende kalsın. Sonra seçtiklerimi Claude’a yaptırmak istiyorum.";

    // Stable Invariant Canonical Records
    const INITIAL_CARDS = [
      {
        id: "card-1",
        revision: 1,
        title: "Sesli Düşünce Akışı ve Eşzamanlı Kavram Rehberliği",
        content: "Kullanıcı serbest konuşurken zihinsel modeli kesintiye uğramadan ilgili teknik kavramlar gösterilir.",
        purpose: "need", // İhtiyaç
        origin: "ai",
        approval: "suggested", // Invariant: AI cannot approve itself
        freshness: "current",
        sourceQuote: "Fikirlerimi konuşarak anlatmak istiyorum. Sistem ben konuşurken doğru kavramları göstersin.",
        startOffset: 0,
        endOffset: 93,
        rationale: "Kullanıcının akıcı düşünme ritmini korumak için konuşma esnasında terim önerisi gereklidir."
      },
      {
        id: "card-2",
        revision: 1,
        title: "Kartları Otomatik Taşıma (Auto-Triage)",
        content: "Yapay zeka çıkarımlara göre kartları mantıksal panolar arasında otonom olarak yerleştirir.",
        purpose: "option", // Seçenek
        origin: "ai",
        approval: "suggested", // Invariant: Must remain unconfirmed option
        freshness: "current",
        sourceQuote: "Belki fikirlerimi otomatik taşıyabilir",
        startOffset: 94,
        endOffset: 131,
        rationale: "Kullanıcı için potansiyel hızlandırıcı bir alternatif, fakat zorunlu şart değildir."
      },
      {
        id: "card-3",
        revision: 1,
        title: "Kullanıcı Nihai Denetim Egemenliği (Override Authority)",
        content: "Yapay zekanın hiçbir kararı kendiliğinden yürürlüğe girmez. Yanlış anlamalarda kontrol kullanıcıdadır.",
        purpose: "decision", // Karar
        origin: "ai",
        approval: "suggested", // Will be explicitly confirmed by user in journey
        freshness: "current",
        sourceQuote: "yanlış anlarsa kontrol bende kalsın",
        startOffset: 137,
        endOffset: 171,
        rationale: "Kullanıcı ajan hatalarını düzeltme ve onaylama hakkını elinde tutmak istemektedir."
      },
      {
        id: "card-4",
        revision: 1,
        title: "Claude Görev Paketi Handoff Modülü",
        content: "Onaylanan kararlar ve gereksinimler deterministik, sınırlandırılmış bir Markdown görevine derlenir.",
        purpose: "need",
        origin: "ai",
        approval: "suggested",
        freshness: "current",
        sourceQuote: "Sonra seçtiklerimi Claude’a yaptırmak istiyorum.",
        startOffset: 173,
        endOffset: 224,
        rationale: "Konuşma geçmişini kirletmeden doğrudan hedefe yönelik kodlama görevi oluşturulmalıdır."
      }
    ];

    function App() {
      // Storage Hydration / Session States
      const [sourceText, setSourceText] = useState(() => {
        return localStorage.getItem("intentcraft_source") || INITIAL_SOURCE;
      });
      const [cards, setCards] = useState(() => {
        const saved = localStorage.getItem("intentcraft_cards");
        return saved ? JSON.parse(saved) : INITIAL_CARDS;
      });
      const [selectedCardId, setSelectedCardId] = useState("card-3");
      const [activeOffset, setActiveOffset] = useState({ start: 137, end: 171 });
      const [showTaskModal, setShowTaskModal] = useState(false);
      const [clarificationAnswered, setClarificationAnswered] = useState(false);
      const [undoStack, setUndoStack] = useState([]);
      const [saveNotice, setSaveNotice] = useState("Kayıtlı");

      // Auto Persistence
      useEffect(() => {
        localStorage.setItem("intentcraft_source", sourceText);
        localStorage.setItem("intentcraft_cards", JSON.stringify(cards));
        setSaveNotice("Kaydedildi");
        const t = setTimeout(() => setSaveNotice("Kayıtlı"), 1500);
        return () => clearTimeout(t);
      }, [sourceText, cards]);

      // Dependency Impact Trigger (Bilinen Bağlantı Etkisi)
      const handleSourceEdit = (newText) => {
        // Record undo snapshot
        setUndoStack(prev => [...prev.slice(-30), { sourceText, cards }]);
        setSourceText(newText);

        // Check offset quotes validity
        setCards(prev => prev.map(card => {
          const slice = newText.slice(card.startOffset, card.endOffset);
          if (slice !== card.sourceQuote) {
            return {
              ...card,
              freshness: "needs_review",
              staleReason: "Kaynak metin değişti; alıntı örtüşmüyor!"
            };
          }
          return card;
        }));
      };

      // Undo Command
      const handleUndo = () => {
        if (undoStack.length === 0) return;
        const last = undoStack[undoStack.length - 1];
        setUndoStack(prev => prev.slice(0, -1));
        setSourceText(last.sourceText);
        setCards(last.cards);
      };

      // Invariant 2: Explicit User Confirmation Action ("Karar olarak onayla")
      const handleConfirmDecision = (cardId) => {
        setUndoStack(prev => [...prev.slice(-30), { sourceText, cards }]);
        setCards(prev => prev.map(c => {
          if (c.id === cardId) {
            return {
              ...c,
              approval: "confirmed",
              origin: "user", // Marked as explicitly verified
              freshness: "current"
            };
          }
          return c;
        }));
      };

      // Card selection links to source quotation inspector
      const handleSelectCard = (card) => {
        setSelectedCardId(card.id);
        setActiveOffset({ start: card.startOffset, end: card.endOffset });
      };

      // Deterministic Task Markdown Generator (Section 10)
      const deterministicMarkdown = useMemo(() => {
        const confirmedRequirements = cards.filter(c => c.approval === "confirmed");
        const unconfirmedOptions = cards.filter(c => c.purpose === "option" && c.approval !== "confirmed");

        return `# IntentCraft Task Package
**Schema Version:** 1.0.0
**Target Model:** Claude 3.5 Sonnet / External Coding Agent
**Status:** DETERMINISTIC_BOUNDED_HANDOFF

---

## 1. Problem & Desired Outcome
- **User Persona:** Non-programmer building AI software.
- **Goal:** Provide continuous intent clarity, precise provenance, and strict user veto power over agent operations.
- **Why It Matters:** Prevents hallucinated agent scaffolding from taking unauthorized architectural actions.

## 2. Confirmed Requirements (Zorunlu Kapsam)
${confirmedRequirements.length > 0 
  ? confirmedRequirements.map(c => `- [${c.id.toUpperCase()}] **${c.title}**\n  - Gerekçe: ${c.rationale}\n  - Kesin Alıntı: "${c.sourceQuote}" [${c.startOffset}:${c.endOffset}]`).join('\n')
  : "- (Henüz onaylanmış zorunlu bir karar bulunmuyor)"}

## 3. Explicit Exclusions (Kapsam Dışı / Onaylanmamış Seçenekler)
${unconfirmedOptions.map(c => `- **${c.title}**: Kullanıcı tarafından onaylanmadı. Mandatory koda dahil edilmeyecek, yalnızca açık alternatif olarak saklanacak.`).join('\n')}

## 4. Acceptance Criteria & Verification Steps
1. [AC-1] Yapay zeka çıktısı doğrudan onaylanmış kabul edilemez; başlangıç durumu her zaman \`origin=ai\`, \`approval=suggested\` olmalıdır.
2. [AC-2] Kaynak alıntı değiştiğinde (\`slice !== exactQuote\`), bağlı kart \`needs_review\` durumuna düşmeli ve "Bilinen bağlantı etkisi" paneline bildirilmelidir.
3. [AC-3] Kullanıcı \`Karar olarak onayla\` eylemini tetiklemeden görev paketi yürütmeye hazır (Ready) statüsüne geçemez.
`;
      }, [cards]);

      // Highlighted Source Render
      const renderedSourceView = useMemo(() => {
        const start = activeOffset.start;
        const end = activeOffset.end;
        if (start >= 0 && end <= sourceText.length && start < end) {
          const before = sourceText.slice(0, start);
          const active = sourceText.slice(start, end);
          const after = sourceText.slice(end);
          return (
            <span>
              {before}
              <mark className="highlight-span text-amber-200">{active}</mark>
              {after}
            </span>
          );
        }
        return <span>{sourceText}</span>;
      }, [sourceText, activeOffset]);

      const confirmedCount = cards.filter(c => c.approval === "confirmed").length;
      const needsReviewCount = cards.filter(c => c.freshness === "needs_review").length;

      return (
        <div className="flex flex-col h-screen overflow-hidden bg-[#07080B]">
          
          {/* TOP LUXURY APP BAR */}
          <header className="h-14 border-b border-white/[0.08] bg-[#0A0D15]/80 backdrop-blur-xl px-6 flex items-center justify-between shrink-0 z-20">
            <div className="flex items-center space-x-4">
              <div className="flex items-center space-x-2.5">
                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-gold-400/25 via-gold-500/10 to-transparent border border-gold-400/40 flex items-center justify-center shadow-[0_0_15px_rgba(212,175,55,0.15)]">
                  <svg className="w-4 h-4 text-gold-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                  </svg>
                </div>
                <div>
                  <h1 className="font-serif text-lg tracking-wide text-white font-medium flex items-center gap-2">
                    IntentCraft
                    <span className="text-[9px] font-mono tracking-widest uppercase px-2 py-0.5 rounded bg-gold-500/10 text-gold-400 border border-gold-500/30">
                      Haute Atelier
                    </span>
                  </h1>
                </div>
              </div>

              <div className="h-4 w-[1px] bg-white/10" />

              {/* Engine Status / Demo Fixture Guard */}
              <div className="hidden sm:flex items-center space-x-2 text-xs px-2.5 py-1 rounded-full bg-white/[0.02] border border-white/[0.06]">
                <span className="w-2 h-2 rounded-full bg-emerald-400 ring-2 ring-emerald-400/20"></span>
                <span className="text-slate-400">Motor:</span>
                <span className="font-mono text-slate-200">Claude-3.5 Local ($0)</span>
              </div>

              {/* Persistence Notice */}
              <div className="text-[11px] font-mono text-slate-500 flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-gold-400/60"></span>
                <span>{saveNotice} (IndexedDB/Local)</span>
              </div>
            </div>

            {/* Action Group */}
            <div className="flex items-center space-x-3">
              {/* Undo Pill */}
              <div className="flex items-center bg-white/[0.03] p-0.5 rounded-lg border border-white/[0.08]">
                <button 
                  onClick={handleUndo}
                  disabled={undoStack.length === 0}
                  className="px-2.5 py-1 text-xs text-slate-400 hover:text-white disabled:opacity-30 disabled:hover:text-slate-400 transition flex items-center gap-1"
                >
                  <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
                  </svg>
                  <span>Geri Al</span>
                </button>
              </div>

              {/* Task Handoff Button */}
              <button 
                onClick={() => setShowTaskModal(true)}
                className="flex items-center space-x-2 px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-gold-500/20 via-gold-400/15 to-transparent hover:from-gold-500/30 hover:via-gold-400/25 text-gold-300 border border-gold-400/40 text-xs font-medium tracking-wide shadow-[0_0_20px_rgba(212,175,55,0.15)] transition"
              >
                <svg className="w-3.5 h-3.5 text-gold-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span>İlk Görevi Hazırla</span>
                <span className="ml-1 px-1.5 py-0.2 bg-gold-400/20 text-gold-200 rounded font-mono text-[10px]">
                  {confirmedCount} Onay
                </span>
              </button>
            </div>
          </header>

          {/* MAIN THREE-COLUMN WORKSPACE */}
          <div className="flex-1 grid grid-cols-12 overflow-hidden">
            
            {/* 1. LEFT: FREEFORM THOUGHT & SOURCE PASSAGES (Col 1-4) */}
            <section className="col-span-12 lg:col-span-4 border-r border-white/[0.08] bg-[#090C13]/60 p-5 flex flex-col space-y-4 overflow-y-auto">
              <div className="flex items-center justify-between">
                <div>
                  <span className="text-[10px] font-mono uppercase tracking-widest text-gold-400/80">Kabul Senaryosu Girdisi</span>
                  <h2 className="text-sm font-serif text-slate-100 font-medium">1. Zihin Akışı & Kaynak Metin</h2>
                </div>
                <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-white/[0.03] border border-white/[0.06] text-slate-400">
                  UTF-16: {sourceText.length}
                </span>
              </div>

              {/* Editable Source Text with Visual Proof */}
              <div className="relative group">
                <label className="text-[10px] font-mono text-slate-500 mb-1 block">
                  Metni değiştirin (Bağlantı etkisini test etmek için):
                </label>
                <textarea
                  value={sourceText}
                  onChange={(e) => handleSourceEdit(e.target.value)}
                  rows="4"
                  className="w-full bg-[#0D111A] text-slate-200 text-xs leading-relaxed p-3.5 rounded-xl border border-white/[0.08] focus:border-gold-400/40 focus:outline-none transition resize-none font-normal"
                />
              </div>

              {/* Live Quotation & Offset Inspection View */}
              <div className="p-3.5 rounded-xl bg-black/40 border border-white/[0.06] space-y-2">
                <div className="flex items-center justify-between text-[11px]">
                  <span className="text-slate-400 font-medium flex items-center gap-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-gold-400 animate-pulse" />
                    Kaynak Alıntı Doğrulama İzleyicisi
                  </span>
                  <span className="text-[10px] font-mono text-gold-300">
                    Aktif Ofset: [{activeOffset.start}:{activeOffset.end}]
                  </span>
                </div>
                <div className="text-xs leading-relaxed text-slate-300 italic font-serif p-2.5 rounded bg-white/[0.01] border border-white/[0.04]">
                  {renderedSourceView}
                </div>
                <p className="text-[10px] text-slate-500 font-mono">
                  Doğrulama: revision.text.slice(start, end) === exactQuote
                </p>
              </div>

              {/* "Bilinen Bağlantı Etkisi" Section 6 Invariant 9 */}
              <div className={`p-3.5 rounded-xl border transition ${
                needsReviewCount > 0 
                  ? "bg-red-500/[0.04] border-red-500/30 text-red-200"
                  : "bg-gold-500/[0.03] border-gold-500/20 text-slate-300"
              }`}>
                <div className="flex items-center justify-between mb-1">
                  <span className="text-xs font-medium flex items-center gap-1.5 text-gold-300">
                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    Bilinen Bağlantı Etkisi
                  </span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-white/[0.05]">
                    {needsReviewCount > 0 ? `${needsReviewCount} İnceleme Gerekiyor` : "Tüm Bağlantılar Güncel"}
                  </span>
                </div>
                <p className="text-[11px] text-slate-400 leading-relaxed">
                  Kaynak metindeki değişiklikler, türetilmiş kararların ve Markdown görev paketinin geçerliliğini anında sorgulatır.
                </p>
              </div>
            </section>

            {/* 2. CENTER: LUXURY CARD BOARD (Col 5-8) */}
            <section className="col-span-12 lg:col-span-5 p-5 flex flex-col space-y-4 bg-[#07080B] overflow-y-auto">
              <div className="flex items-center justify-between">
                <div>
                  <span className="text-[10px] font-mono uppercase tracking-widest text-gold-400/80">Çıkarımlar & Kararlar</span>
                  <h2 className="text-sm font-serif text-slate-100 font-medium">2. Yapılandırılmış Niyet Panosu</h2>
                </div>
                <span className="text-[11px] text-slate-500 font-mono">{cards.length} Kart</span>
              </div>

              <div className="space-y-3.5">
                {cards.map(card => {
                  const isSelected = selectedCardId === card.id;
                  const isConfirmed = card.approval === "confirmed";
                  const isStale = card.freshness === "needs_review";

                  return (
                    <div
                      key={card.id}
                      onClick={() => handleSelectCard(card)}
                      className={`relative p-4 rounded-xl border transition-all duration-300 cursor-pointer ${
                        isSelected 
                          ? "bg-[#101522] border-gold-400/40 shadow-[0_4px_30px_rgba(212,175,55,0.08)]"
                          : "bg-[#0B0E16] hover:bg-[#0E121E] border-white/[0.07]"
                      }`}
                    >
                      {/* Top Badges */}
                      <div className="flex items-center justify-between mb-2">
                        <div className="flex items-center space-x-2">
                          <span className={`px-2 py-0.5 rounded text-[9.5px] font-mono uppercase tracking-wider border ${
                            card.purpose === "decision"
                              ? "bg-emerald-500/10 text-emerald-300 border-emerald-500/30"
                              : card.purpose === "option"
                              ? "bg-amber-500/10 text-amber-300 border-amber-500/30"
                              : "bg-blue-500/10 text-blue-300 border-blue-500/30"
                          }`}>
                            {card.purpose === "decision" ? "Karar" : card.purpose === "option" ? "Seçenek (Option)" : "İhtiyaç"}
                          </span>

                          <span className="text-[10px] font-mono text-slate-500">
                            Kaynak: {card.origin === "ai" ? "AI Çıkarımı" : "Kullanıcı"}
                          </span>
                        </div>

                        {/* Status Badges */}
                        <div className="flex items-center space-x-1.5">
                          {isStale && (
                            <span className="px-2 py-0.5 rounded text-[9px] font-mono bg-red-500/20 text-red-300 border border-red-500/40 animate-pulse">
                              needs_review
                            </span>
                          )}

                          <span className={`px-2 py-0.5 rounded text-[9.5px] font-mono flex items-center gap-1 ${
                            isConfirmed 
                              ? "bg-emerald-400/15 text-emerald-300 border border-emerald-400/30"
                              : "bg-white/[0.04] text-slate-400 border border-white/[0.08]"
                          }`}>
                            {isConfirmed ? "✓ Onaylandı" : "Öneri (AI)"}
                          </span>
                        </div>
                      </div>

                      {/* Title */}
                      <h3 className="text-xs font-medium text-slate-100 mb-1.5">{card.title}</h3>

                      {/* Content */}
                      <p className="text-[11px] text-slate-400 leading-relaxed mb-3">
                        {card.content}
                      </p>

                      {/* Exact Quote Inspection Pill */}
                      <div className="p-2 rounded bg-black/40 border border-white/[0.05] text-[11px] mb-3">
                        <span className="text-[9px] font-mono text-gold-400/80 block">
                          Kesin Alıntı [{card.startOffset}:{card.endOffset}]:
                        </span>
                        <p className="text-slate-300 italic font-serif">“{card.sourceQuote}”</p>
                      </div>

                      {/* Action Bar (Invariant 1 & 2 Enforcement) */}
                      <div className="flex items-center justify-between pt-2 border-t border-white/[0.06]">
                        <span className="text-[10px] text-slate-500 font-mono">
                          Gerekçe: {card.rationale.slice(0, 35)}...
                        </span>

                        {!isConfirmed ? (
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              handleConfirmDecision(card.id);
                            }}
                            className="px-3 py-1 rounded bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[10.5px] font-medium transition flex items-center gap-1"
                          >
                            <span>Karar olarak onayla</span>
                            <span className="text-[9px]">→</span>
                          </button>
                        ) : (
                          <span className="text-[10px] font-mono text-emerald-400 flex items-center gap-1">
                            <span>🛡️ Kullanıcı doğruladı</span>
                          </span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            {/* 3. RIGHT: CONTEXTUAL LEARNING & CLARIFICATION (Col 9-12) */}
            <section className="col-span-12 lg:col-span-3 border-l border-white/[0.08] bg-[#090C13]/60 p-5 flex flex-col space-y-5 overflow-y-auto">
              <div>
                <span className="text-[10px] font-mono uppercase tracking-widest text-gold-400/80">Kavram & Soru</span>
                <h2 className="text-sm font-serif text-slate-100 font-medium">3. Öğrenme & Netleştirme</h2>
              </div>

              {/* ONE Useful Clarification Question at a time (Section 8) */}
              <div className="p-4 rounded-xl bg-gradient-to-b from-[#121624] to-[#0A0D15] border border-gold-400/30 space-y-3 shadow-lg">
                <div className="flex items-center justify-between text-[10px] font-mono">
                  <span className="px-2 py-0.5 rounded bg-gold-400/10 text-gold-300 border border-gold-400/30">
                    Netleştirme Sorusu #1
                  </span>
                  <span className="text-slate-500">Önem: Yüksek</span>
                </div>

                <h4 className="text-xs font-serif text-white font-medium leading-relaxed">
                  “Yanlış anlarsa kontrol bende kalsın” ifadesini somutlaştıralım: Ajan bir işlem yapmadan önce onayınızı nasıl sorsun?
                </h4>

                {/* "Neden Önemli?" Explanation */}
                <div className="p-2.5 rounded-lg bg-black/40 border border-white/[0.05] text-[11px] text-slate-400">
                  <span className="text-gold-300 font-medium block text-[10px] mb-0.5">Neden önemli?</span>
                  Yapay zekanın otomatik kod oluştururken geri alınamaz veritabanı veya dosya silme işlemlerini engeller.
                </div>

                {/* Interactive Answers */}
                <div className="space-y-1.5 pt-1">
                  <button 
                    onClick={() => setClarificationAnswered(true)}
                    className={`w-full text-left p-2 rounded-lg border text-[11px] transition ${
                      clarificationAnswered 
                        ? "bg-emerald-500/20 border-emerald-500/40 text-emerald-200"
                        : "bg-white/[0.02] hover:bg-white/[0.06] border-white/[0.08] text-slate-300"
                    }`}
                  >
                    {clarificationAnswered ? "✓ Seçildi: Her komutta kullanıcı onayı zorunlu kılınsın." : "1. Her kritik eylemde dur ve onay iste (Gatekeeper)"}
                  </button>

                  <button 
                    onClick={() => alert("Alternatifler listelendi: 1. Kuru çalıştırma (Dry-run), 2. Değişiklik önizlemesi (Diff check), 3. Otomatik geri alma (Rollback).")}
                    className="w-full text-left p-2 rounded-lg bg-white/[0.02] hover:bg-white/[0.05] border border-white/[0.06] text-slate-400 hover:text-slate-200 text-[10.5px] italic transition"
                  >
                    “Henüz bilmiyorum; seçenekleri göster”
                  </button>
                </div>
              </div>

              {/* LIVING GLOSSARY (Yaşayan Proje Sözlüğü) */}
              <div className="space-y-2.5">
                <span className="text-[10px] font-mono uppercase text-slate-400 tracking-wider">Yaşayan Sözlük</span>

                <div className="p-3 rounded-xl bg-white/[0.02] border border-white/[0.06] space-y-1.5">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-medium text-slate-200">Deterministik Görev</span>
                    <span className="text-[9px] font-mono text-slate-500">Deterministic Handoff</span>
                  </div>
                  <p className="text-[11px] text-slate-400 leading-relaxed">
                    Yorum farkı yaratmayan, kabul kriterleri ve sınırları kesin olarak belirlenmiş talimat belgesi.
                  </p>
                  <div className="p-2 rounded bg-gold-500/[0.04] border border-gold-500/15 text-[10px] font-serif italic text-gold-200/90">
                    Projedeki Örneği: Claude'a gönderilecek Markdown dosyasında unconfirmed seçeneklerin elenmesi.
                  </div>
                </div>
              </div>

              {/* "Beni Sorgula" Button (Section 8) */}
              <button 
                onClick={() => alert("Beni sorgula modu aktif: Claude yeni bir kavramsal soru hazırlıyor...")}
                className="w-full py-2 px-3 rounded-lg bg-white/[0.02] hover:bg-white/[0.06] border border-white/[0.08] text-xs text-slate-400 hover:text-white transition flex items-center justify-center gap-2"
              >
                <span>🔍 “Beni sorgula” modunu aç</span>
              </button>
            </section>
          </div>

          {/* TASK REVIEW & EXPORT MODAL (Section 10 Handoff Atelier) */}
          {showTaskModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#0A0D15] border border-gold-400/40 rounded-2xl w-full max-w-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                
                {/* Header */}
                <div className="px-6 py-3.5 border-b border-white/[0.08] flex items-center justify-between bg-white/[0.02]">
                  <div>
                    <h3 className="font-serif text-base text-white font-medium">Deterministik Görev İnceleme & Markdown Handoff</h3>
                    <p className="text-[11px] text-slate-400">Yalnızca onaylanmış kararlar mandatory olarak dışa aktarılır.</p>
                  </div>
                  <button 
                    onClick={() => setShowTaskModal(false)}
                    className="p-1 rounded text-slate-400 hover:text-white"
                  >
                    ✕
                  </button>
                </div>

                {/* Readiness Matrix (Section 10 Invariant Separation) */}
                <div className="px-6 py-2.5 bg-[#07090F] border-b border-white/[0.06] grid grid-cols-2 gap-3 text-xs font-mono">
                  <div className="flex items-center justify-between p-2 rounded bg-white/[0.02] border border-white/[0.04]">
                    <span className="text-slate-400">Niyet Hazırlığı:</span>
                    <span className="text-emerald-400 font-medium">
                      {confirmedCount > 0 ? "✓ Hazır (Kararlar Onaylı)" : "⚠️ Onay Bekleniyor"}
                    </span>
                  </div>
                  <div className="flex items-center justify-between p-2 rounded bg-white/[0.02] border border-white/[0.04]">
                    <span className="text-slate-400">Yürütme Hazırlığı:</span>
                    <span className="text-gold-300 font-medium">
                      Bilinmiyor (Harici Kodlama Ajanı)
                    </span>
                  </div>
                </div>

                {/* Deterministic Markdown Code Area */}
                <div className="flex-1 p-5 overflow-y-auto bg-[#05060A] font-mono text-xs text-slate-300 leading-relaxed">
                  <pre className="whitespace-pre-wrap selection:bg-gold-500/30">
                    {deterministicMarkdown}
                  </pre>
                </div>

                {/* Modal Footer */}
                <div className="px-6 py-3 border-t border-white/[0.08] bg-[#0A0D15] flex items-center justify-between">
                  <span className="text-[10px] font-mono text-slate-500">
                    Kural: Unconfirmed seçenekler ("Otomatik taşıma") zorunlu kapsama dahil edilmedi.
                  </span>
                  <div className="flex items-center space-x-2">
                    <button 
                      onClick={() => setShowTaskModal(false)}
                      className="px-3 py-1.5 rounded bg-white/5 hover:bg-white/10 text-xs text-slate-300 transition"
                    >
                      Kapat
                    </button>
                    <button 
                      onClick={() => {
                        navigator.clipboard.writeText(deterministicMarkdown);
                        alert("Deterministik Markdown panoya kopyalandı! Claude veya harici bir ajana yapıştırabilirsiniz.");
                      }}
                      className="px-4 py-1.5 rounded bg-gold-400 hover:bg-gold-300 text-black font-medium text-xs shadow-[0_0_15px_rgba(212,175,55,0.3)] transition"
                    >
                      Markdown Kopyala & Dışa Aktar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
